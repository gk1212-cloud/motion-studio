name: auto-film

on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic (empty = queue)"
        required: false
        default: ""
      minutes:
        description: "Target runtime"
        required: false
        default: "5"
      upload:
        description: "Upload to YouTube"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

concurrency:
  group: auto-film
  cancel-in-progress: false

permissions:
  contents: write

env:
  HF_VERSION: "0.8.226"
  HF_MINUTES: ${{ github.event.inputs.minutes || '5' }}
  HF_MIN_SCORE: "6"
  HF_QUALITY: "draft"

jobs:
  plan:
    name: plan + gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install HyperFrames
        run: npm i -g hyperframes@${{ env.HF_VERSION }}
      - name: Plan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOPIC: ${{ github.event.inputs.topic }}
        run: node tools/plan.mjs
      - name: Build
        run: node tools/build.mjs
      - name: Check
        run: npx --yes hyperframes@${{ env.HF_VERSION }} check || true
      - name: Commit
        run: |
          git config user.name "auto-film"
          git config user.email "auto-film@users.noreply.github.com"
          git add film content compositions index.html 2>/dev/null || true
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "film: $(node -p 'require(\"./film/storyboard.json\").meta.title')"
          git pull --rebase --autostash
          git push

  render:
    name: render
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ env.HF_VERSION }}
      - name: Install HyperFrames + ffmpeg
        run: |
          npm i -g hyperframes@${{ env.HF_VERSION }}
          sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Render
        run: node tools/render.mjs --quality ${{ env.HF_QUALITY }}
      - name: Upload render
        uses: actions/upload-artifact@v4
        with:
          name: rendered
          path: renders/film.mp4
          retention-days: 3
