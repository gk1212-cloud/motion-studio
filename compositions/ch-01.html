<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Illusion of Choice Overload</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050505; color: #f5f5f5; font-family: 'Helvetica Neue', 'Segoe UI', Arial, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }
  .clip { position: absolute; inset: 0; }
  .kw { will-change: transform, opacity, filter; }
</style>
</head>
<body>
<div data-composition-id="ch-01" data-width="1920" data-height="1080" data-start="0" data-duration="19" data-fps="30" style="position:relative;width:1920px;height:1080px;overflow:hidden;">
<div class="clip" data-start="0" data-duration="5" data-track-index="0"
  style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 180px;background:linear-gradient(160deg,#050505 0%,#0f0f1a 50%,#050505 100%);overflow:hidden;">
  <div style="position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 20% 50%,#ff336615 0%,transparent 60%);"></div>
  <div style="font-size:20px;letter-spacing:8px;color:#ff3366;opacity:0;transform:translateX(-40px);" class="kw" data-delay="0">PART ONE</div>
  <div style="font-size:160px;font-weight:900;margin-top:12px;line-height:0.95;letter-spacing:-4px;"><span style="display:inline-block;opacity:0;transform:translateY(60px);" class="kw" data-delay="0.4">The</span> <span style="display:inline-block;opacity:0;transform:translateY(60px);" class="kw" data-delay="0.52">Friction</span> <span style="display:inline-block;opacity:0;transform:translateY(60px);" class="kw" data-delay="0.64">Problem</span></div>
  <div style="width:0px;height:3px;background:#ff3366;margin-top:40px;" class="kw-bar" data-delay="0.9" data-width="120"></div>
  <div style="font-size:24px;margin-top:30px;opacity:0;color:rgba(255,255,255,0.5);" class="kw" data-delay="1.1">The Friction Problem</div>
</div>
<div class="clip" data-start="5" data-duration="7" data-track-index="0"
  style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 200px;background:#080808;">
  <div style="font-size:96px;font-weight:800;line-height:1.05;letter-spacing:-2px;"><div style="opacity:1;line-height:1.1;"><span style="display:inline-block;opacity:0;transform:translateY(30px);" class="kw" data-delay="0.15">It's</span> <span style="display:inline-block;opacity:0;transform:translateY(30px);" class="kw" data-delay="0.22">not</span> <span style="display:inline-block;opacity:0;transform:translateY(30px);" class="kw" data-delay="0.29000000000000004">the</span> <span style="display:inline-block;opacity:0;transform:translateY(30px);" class="kw" data-delay="0.36000000000000004">choice,</span></div><div style="opacity:1;line-height:1.1;"><span style="display:inline-block;opacity:0;transform:translateY(30px);" class="kw" data-delay="0.43000000000000005">It's</span> <span style="display:inline-block;opacity:0;transform:translateY(30px);" class="kw" data-delay="0.5">the</span> <span style="display:inline-block;opacity:0;transform:translateY(30px);" class="kw" data-delay="0.5700000000000001">context</span> <span style="display:inline-block;opacity:0;transform:translateY(30px);" class="kw" data-delay="0.6400000000000001">tax.</span></div></div>
</div>
<div class="clip" data-start="12" data-duration="7" data-track-index="0"
  style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#080808;overflow:hidden;">
  <div style="position:absolute;inset:0;background:radial-gradient(ellipse at center,#ff336610 0%,transparent 70%);"></div>
  <div style="font-size:280px;font-weight:900;color:#ff3366;line-height:1;opacity:0;transform:scale(0.5);" class="kw" data-delay="0">0</div>
  <div style="font-size:40px;margin-top:24px;max-width:900px;text-align:center;opacity:0;transform:translateY(20px);" class="kw" data-delay="0.5"></div>
  
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  document.querySelectorAll('.kw').forEach((el) => {
    const d = parseFloat(el.dataset.delay || 0);
    const from = { opacity: 0, y: 30, filter: "blur(4px)" };
    if (el.classList.contains('anim-bar') || el.classList.contains('kw-bar')) {
      gsap.set(el, { scaleX: 0, transformOrigin: "left center" });
      tl.to(el, { scaleX: 1, duration: 0.8, ease: "power3.out" }, d);
    } else if (el.classList.contains('anim-bar2')) {
      const pct = el.dataset.pct || 0;
      gsap.set(el, { width: "0%" });
      tl.to(el, { width: pct + "%", duration: 1.2, ease: "power2.out" }, d);
    } else {
      gsap.set(el, from);
      tl.to(el, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, d);
    }
  });
  window.__timelines["ch-01"] = tl;
</script>
</body>
</html>
